<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Muğla Su Siparişi | Çok Yakında</title>
    <meta
      name="description"
      content="Muğla'da su siparişi artık çok daha kolay. Çok yakında buradayız."
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;

        font-family: Arial, Helvetica, sans-serif;

        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.16),
            transparent 35%
          ),
          linear-gradient(135deg, #0088cc, #005f99);

        color: white;
        text-align: center;
      }

      .container {
        max-width: 800px;
        width: 100%;
      }

      .badge {
        display: inline-block;
        padding: 10px 18px;
        margin-bottom: 28px;

        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;

        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);

        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(48px, 9vw, 100px);
        line-height: 0.95;
        font-weight: 800;
        letter-spacing: -4px;
      }

      h1 span {
        display: block;
      }

      .muğla {
        color: #bfeaff;
      }

      p {
        margin-top: 32px;
        font-size: clamp(17px, 2vw, 22px);
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.82);
      }

      .domain {
        margin-top: 42px;
        font-size: 15px;
        opacity: 0.65;
        letter-spacing: 0.5px;
      }

      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 8px;

        background: #62ffb0;
        border-radius: 50%;

        box-shadow: 0 0 18px rgba(98, 255, 176, 0.8);

        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }

        50% {
          transform: scale(1.5);
          opacity: 0.5;
        }
      }

      @media (max-width: 600px) {
        h1 {
          letter-spacing: -2px;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <div class="badge">
        <span class="dot"></span>
        Çok Yakında
      </div>

      <h1>
        <span>Yakındayız.</span>
        <span>Buradayız.</span>
        <span class="muğla">Muğla'dayız.</span>
      </h1>

      <p>
        Muğla'da su siparişini daha hızlı, daha kolay ve daha erişilebilir hale
        getirmek için hazırlanıyoruz.
        <br />
        Çok yakında hizmetinizdeyiz.
      </p>

      <div class="domain">muglasusiparisi.com</div>
    </main>
  </body>
</html>
